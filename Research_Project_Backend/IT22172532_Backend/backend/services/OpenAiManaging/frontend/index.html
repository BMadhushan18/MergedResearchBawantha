<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAiManaging • Gemini Chat</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f6f7fb; color: #111; }
    .wrap { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e6e8ef; border-radius: 12px; padding: 16px; }
    .row { display: grid; grid-template-columns: 1fr 220px; gap: 12px; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; }
    input, select, textarea { border: 1px solid #cfd6e4; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }
    button { border: 0; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #1f6feb; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .muted { font-size: 12px; color: #666; margin-top: 8px; }
    .status { font-size: 12px; color: #333; margin-top: 10px; }
    .hr { height: 1px; background: #eef0f6; margin: 14px 0; }
    .resp { white-space: pre-wrap; border: 1px solid #e6e8ef; background: #fbfcff; border-radius: 10px; padding: 12px; font-size: 14px; min-height: 72px; }
    .respTitle { font-size: 12px; color: #444; margin-bottom: 6px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 12px; }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 650; }
    .small { font-size: 12px; color:#666; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Gemini Chat (via local FastAPI)</h1>
      <div class="small">Calls <code>/api/gemini</code> on your backend</div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label for="apiBase">API URL</label>
          <input id="apiBase" type="text" value="http://127.0.0.1:8000/api/gemini" />
          <div class="muted">Backend must be running. Key is sent to the backend with this request (not stored by this page).</div>
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
            <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
          </select>
        </div>
      </div>

      <div style="height: 12px"></div>

      <div class="row">
        <div>
          <label for="apiKey">Gemini API key (optional if backend has GEMINI_API_KEY)</label>
          <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" />
        </div>
        <div>
          <label for="temperature">Temperature</label>
          <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.0" />
        </div>
      </div>

      <div style="height: 12px"></div>

      <label for="prompt">Message</label>
      <textarea id="prompt" placeholder="Type a message, e.g. hi"></textarea>

      <div style="height: 10px"></div>

      <div class="row" style="grid-template-columns: 1fr 220px; align-items: end;">
        <div class="status" id="status">Ready.</div>
        <button id="sendBtn">Send</button>
      </div>

      <div class="hr"></div>

      <div class="respTitle">Response</div>
      <div class="resp" id="response"></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
